name: Check flake

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Test updater feed fallback
        run: |
          nix shell --inputs-from . \
            nixpkgs#bash \
            nixpkgs#jq \
            nixpkgs#coreutils \
            nixpkgs#gnused \
            nixpkgs#python3 \
            --command ./tests/update-feed-fallback.sh

      - name: Evaluate flake
        run: nix flake check --no-build --show-trace

      - name: Build package
        run: nix build .#packages.${{ matrix.system }}.default --print-build-logs

      - name: Verify upstream macOS signature and notarization ticket
        if: matrix.system == 'aarch64-darwin'
        run: |
          codesign --verify --deep --strict "result/Applications/Grok Bot.app"
          xcrun stapler validate "result/Applications/Grok Bot.app"
